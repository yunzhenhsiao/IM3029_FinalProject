<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球海洋塑膠污染地圖 · SDG 14</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- 共用樣式（已內嵌） -->
<style>
/* ═══════════════════════════════════════════════════════
   shared.css — SDG 14 Ocean Plastic Project
   共用設計系統：所有頁面引入此檔案
═══════════════════════════════════════════════════════ */

/* ─── DESIGN TOKENS ───────────────────────────────────── */
:root {
  --bg:           #060d17;
  --surface:      #0b1623;
  --surface2:     #0f1e30;
  --border:       #1a2d44;
  --border-light: #243d59;
  --text-primary: #d8e8f5;
  --text-muted:   #6b8ba4;
  --text-faint:   #3a5570;
  --accent:       rgb(207, 207, 204);
  --accent-dim:   rgb(155, 155, 152);
  --danger:       #e05c5c;
  --warn:         #c89b3c;
  --safe:         #3cb27a;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-mono:    'IBM Plex Mono', 'Courier New', monospace;
  --font-body:    'IBM Plex Sans', system-ui, sans-serif;
}

/* ─── RESET ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
}

/* ─── PAGE-SPECIFIC STYLES ────────────────────────────── */
  :root {
    --sidebar-w: 380px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body { height: 100%; overflow: hidden; }

  #app {
    height: 100vh;
    position: relative;
  }

  /* ─── MAP ─────────────────────────────────────────────── */
  #map-container { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  #map { width: 100%; height: 100%; background-color: #2A2A2A !important;}

  /* ─── FIX: Windows Chrome focus outline on map polygons ── */
  .leaflet-interactive:focus {
    outline: none !important;
  }
  path.leaflet-interactive:focus {
    outline: none !important;
  }

  /* ─── FORCE PLAYFAIR DISPLAY (cross-platform) ─────────── */
  h1, .counter-num {
    font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif !important;
  }

  /* ─── TOP BRAND（浮在地圖左上，無背景色塊）─────────── */
  #top-brand {
    position: fixed;
    top: 10px;
    left: 35px;
    z-index: 1500;
    pointer-events: none;          /* 預設不攔截地圖點擊 */
  }
  #top-brand > * { pointer-events: auto; }

  .brand-link {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: rgba(216, 232, 245, 0.42);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.25s;
    text-shadow: 0 1px 5px rgba(0,0,0,0.95);
    white-space: nowrap;
  }
  .brand-link::before {
    content: '←';
    font-style: normal;
    transition: transform 0.25s;
  }
  .brand-link:hover { color: rgba(216, 232, 245, 0.78); }
  .brand-link:hover::before { transform: translateX(-3px); }

  .map-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--text-primary);
    line-height: 1.28;
    margin-top: 6px;
    text-shadow:
      0 1px 6px rgba(0,0,0,1),
      0 2px 18px rgba(0,0,0,0.7);
  }

  /* ─── 視角切換 tab（通用，legend 內使用）────────────── */
  .mode-btns {
    display: flex;
    gap: 3px;
  }

  .mode-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 4px 0;
    flex: 1;
    text-align: center;
    border-radius: 2px;
    border: 1px solid transparent;
    background: transparent;
    color: rgba(107, 139, 164, 0.6);
    cursor: pointer;
    transition: border-color 0.22s ease, color 0.22s ease, background 0.22s ease;
    white-space: nowrap;
  }
  .mode-btn:hover {
    border-color: rgba(255,255,255,0.15);
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
  }
  /* active 顏色各自對應 legend 色系 */
  .mode-btn[data-mode="share"].active {
    border-color: rgba(97, 165, 194, 0.55);   /* 藍色系 */
    color: #89c2d9;
    background: rgba(42, 111, 151, 0.08);
  }
  .mode-btn[data-mode="probability"].active {
    border-color: rgba(90, 184, 150, 0.55);   /* 青綠色系 */
    color: #5ab896;
    background: rgba(61, 158, 122, 0.08);
  }
  .mode-btn[data-mode="perCapita"].active {
    border-color: rgba(149, 149, 213, 0.55);  /* 靛紫色系 */
    color: #9595d5;
    background: rgba(112, 112, 192, 0.08);
  }

  /* ─── 桌機版視角按鈕（移至 #top-brand 標題下方）─── */
  #top-brand .mode-btns {
    margin-top: 10px;
  }
  /* 浮在地圖上，加文字陰影確保可讀性 */
  #top-brand .mode-btn {
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
  }

  /* ─── MOBILE MODE BUTTON（手機版循環切換，桌機隱藏）── */
  #mobile-mode-btn { display: none; }

  /* ─── LEGEND TOGGLE（手機版展開按鈕，桌機隱藏）───── */
  #legend-toggle { display: none; }

  /* ─── MOBILE SIDEBAR（手機版觸發 / 關閉，桌機隱藏）── */
  #mobile-sidebar-btn  { display: none; }
  #sidebar-close-mobile { display: none; }

  /* ─── MOBILE CARD（手機版資訊卡，桌機隱藏）─────── */
  #mobile-card, #mobile-card-overlay { display: none; }
  .mobile-mode-icon { display: inline-block; }
  @keyframes spin-once {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .mobile-mode-icon.spinning {
    animation: spin-once 0.35s ease;
  }

  #loading {
    position: absolute;
    inset: 0;
    z-index: 5000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  .loading-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .loading-bar-track {
    width: 200px; height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    animation: loadingProgress 1.8s var(--ease-out) forwards;
  }
  @keyframes loadingProgress {
    from { width: 0; }
    to   { width: 100%; }
  }

  /* ─── LEAFLET OVERRIDES ───────────────────────────────── */
  .leaflet-control-attribution {
    background: rgba(6,13,23,0.85) !important;
    color: var(--text-faint) !important;
    font-family: var(--font-mono) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--text-muted) !important; }
  /* 讓共用容器回到底部，attribution 維持原位 */
  .leaflet-bottom.leaflet-right { bottom: 0 !important; }
  /* 只把 zoom 控制獨立定位在 counter 上方 */
  .leaflet-control-zoom {
    position: fixed !important;
    bottom: 100px !important;
    right: 10px !important;
  }
  .leaflet-control-zoom a {
    background: var(--surface2) !important;
    color: var(--text-primary) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-zoom a:hover { background: var(--border) !important; }

  .marker-tooltip {
    background: rgba(6,13,23,0.92);
    border: 1px solid var(--border-light);
    border-radius: 2px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 10px;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .leaflet-tooltip {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    border-radius: 0 !important;
  }
  .leaflet-tooltip::before { display: none; }

  /* ─── POPUP CARD ──────────────────────────────────────── */
  .leaflet-popup-content-wrapper {
    background: rgba(8, 16, 28, 0.97) !important;
    border: 1px solid rgba(100,160,210,0.25) !important;
    border-radius: 4px !important;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7) !important;
    padding: 0 !important;
    backdrop-filter: blur(12px);
    min-width: 260px;
    max-width: 320px;
  }
  .leaflet-popup-content {
    margin: 0 !important;
    width: auto !important;
    max-height: auto!important;
    overflow-y:auto !important;
  }
  .leaflet-popup-tip-container { display: none; }
  .leaflet-popup, .leaflet-popup-pane, .sdg-popup {
    z-index: 2200 !important;
  }
  .leaflet-popup-close-button {
    color: rgba(160,190,220,0.5) !important;
    font-size: 18px !important;
    top: 8px !important; right: 10px !important;
    padding: 0 !important;
    line-height: 1 !important;
  }
  .leaflet-popup-close-button:hover { color: #d8e8f5 !important; background: none !important; }

  /* popup inner layout */
  .pc-head {
    display: flex;
    flex-direction: column;   /* 國家名稱在上，ISO 簡寫在下，不與 × 按鈕衝突 */
    align-items: flex-start;
    gap: 3px;
    padding: 12px 36px 10px 16px;  /* 右側留空給 × 關閉按鈕 */
    border-bottom: 1px solid rgba(100,160,210,0.15);
  }
  .pc-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: #d8e8f5;
    line-height: 1.2;
  }
  .pc-iso {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    color: rgba(160,190,220,0.5);
  }
  .pc-tagline {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(100,160,210,0.12);
    font-size: 11px;
    font-style: italic;
    color: rgba(160,190,220,0.7);
    line-height: 1.6;
  }
  .pc-row {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(100,160,210,0.1);
  }
  .pc-row:last-child { border-bottom: none; padding-bottom: 14px; }
  .pc-row-head {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .pc-row-main {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .pc-val {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .pc-val.danger { color: #e05a5a; }
  .pc-val.warn   { color: #e0a050; }
  .pc-val.teal   { color: #3d9e7a; }
  .pc-val.purple { color: #7070c0; }
  .pc-rank {
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(160,190,220,0.55);
    white-space: nowrap;
  }
  .pc-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(160,190,220,0.6);
    margin-top: 3px;
  }
  .pc-nodata {
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(160,190,220,0.35);
    font-style: italic;
  }

  /* ─── SIDEBAR ─────────────────────────────────────────── */
  #sidebar {
    position: fixed;
    top: 0; right: 0;
    width: var(--sidebar-w);
    height: 100vh;
    z-index: 2000;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.55s var(--ease-out);
    overflow: hidden;
  }
  #sidebar.collapsed {
    transform: translateX(calc(var(--sidebar-w) - 0px));
  }
  #sidebar:not(.collapsed) {
    box-shadow: -20px 0 80px rgba(0,0,0,0.6);
  }

  /* ─── SIDEBAR TAB (貼右邊緣) ─────────────────────────── */
  #sidebar-tab {
    position: fixed;
    top: 50%;
    right: var(--sidebar-w);
    transform: translateY(-50%);
    z-index: 2001;
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 4px 0 0 4px;
    padding: 14px 8px;
    cursor: pointer;
    transition: right 0.55s var(--ease-out), background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  #sidebar-tab:hover { background: var(--surface2); }
  #sidebar.collapsed ~ #sidebar-tab,
  #sidebar-tab.collapsed-pos {
    right: 0;
  }
  .sidebar-tab-text {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .sidebar-tab-arrow {
    font-size: 12px;
    color: var(--accent);
    writing-mode: horizontal-tb;
  }

  /* ─── SIDEBAR SEARCH ──────────────────────────────────── */
  #sidebar-search-wrap {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sidebar-search {
    width: 100%;
    box-sizing: border-box;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-light);
    border-radius: 3px;
    padding: 8px 12px 8px 32px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
    position: relative;
  }
  #sidebar-search::placeholder { color: var(--text-faint); }
  #sidebar-search:focus { border-color: var(--accent); }
  .search-icon-wrap {
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--text-faint);
    pointer-events: none;
  }

  /* ─── SEARCH RESULTS ──────────────────────────────────── */
  #sidebar-search-results {
    flex-shrink: 0;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    border-bottom: 1px solid var(--border);
    display: none;
  }
  #sidebar-search-results.visible { display: block; }

  .search-result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--surface2); }
  .search-result-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-primary);
  }
  .search-result-val {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
  }

  /* ─── RANKING LIST ────────────────────────────────────── */
  #sidebar-ranking-wrap {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #sidebar-ranking-title {
    padding: 12px 16px 11px 13px;  /* 左側讓出 3px 給豎線 */
    font-family: var(--font-mono);
    font-size: 11px;               /* 稍微放大 */
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: transparent;                    /* 由 JS renderRanking() 動態設定 */
    border-left: 3px solid transparent;   /* 由 JS renderRanking() 動態設定 */
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .ranking-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .ranking-item:hover { background: var(--surface2); }
  .ranking-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    width: 16px;
    flex-shrink: 0;
    text-align: right;
  }
  .ranking-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ranking-val {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* ─── MODE TOGGLE（同上，保留區塊避免 specificity 問題）── */

  #sidebar.opened {
    transform: translateX(0);
  }

  /* ─── LEGEND ──────────────────────────────────────────── */
  #legend {
    position: fixed;
    bottom: 35px; left: 21px;
    z-index: 1500;
    background: rgba(11,22,35,0.92);
    border: 1px solid var(--border);
    padding: 14px 16px;
    backdrop-filter: blur(8px);
    min-width: 216px;
  }

  /* 視角切換小標題 */
  .legend-section-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: rgb(207, 207, 204);
  }

  /* 分隔線（延伸至 padding 邊緣）*/
  .legend-separator {
    height: 1px;
    background: var(--border);
    margin: 12px -16px;
  }

  .legend-title {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgb(207, 207, 204);
    margin-bottom: 10px;
  }
  .legend-items { display: flex; flex-direction: column; gap: 7px; }
  .legend-item  { display: flex; align-items: center; gap: 10px; }
  .legend-swatch { width: 14px; height: 14px; flex-shrink: 0; border-radius: 2px; }
  .legend-text { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }

  /* 設定 Legend 的過度動畫與初始狀態 */
  #legend {
    transition: transform 0.3s var(--ease-out), opacity 0.3s;
  }

  /* 當視窗寬度小於 1000px (假設是一半時) 自動隱藏或縮小 */
  @media (max-width: 1000px) {
    #legend {
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
    }
  }

  /* 收合按鈕的樣式 (可自行添加 HTML 按鈕) */
  .legend-collapsed #legend {
    display: none;
  }
  /* ─── COUNTER ─────────────────────────────────────────── */
  #counter {
    position: fixed;
    bottom: 28px; right: 24px;
    z-index: 1500;
    text-align: right;
    color: rgb(207, 207, 204);
  }
  .counter-num   { font-family: var(--font-display); font-size: 28px; font-weight: 900;     color: rgb(207, 207, 204);
; letter-spacing: -0.03em; line-height: 1.5; }
  .counter-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }

  /* ─── FOOTER ──────────────────────────────────────────── */
  #footer {
    position: fixed;
    bottom: 0; left: 0px; width: 100%;
    z-index: 1500;
    /* background: rgba(6, 13, 23, 0.8); */
    /* border-top: 1px solid rgba(255,255,255,0.1); */
    padding: 8px 20px;
    text-align: left;
    box-sizing: border-box;
  }
  .footer-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin: 0;
  }

  /* ─── 手機版（768px 以下）─────────────────────────── */
  @media (max-width: 768px) {
    /* 手機版循環切換按鈕 */
    #mobile-mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 5px 13px 5px 10px;
      border-radius: 3px;
      border: 1px solid;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.2s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    #mobile-mode-btn:active { opacity: 0.7; }
    #mobile-mode-btn[data-mode="share"] {
      border-color: rgba(97, 165, 194, 0.6);

    /* 縮放按鈕、版權標示、footer 手機版全部隱藏 */
    .leaflet-control-zoom        { display: none !important; }
    .leaflet-control-attribution { display: none !important; }
    #footer                      { display: none; }

    /* 桌機版三個按鈕在手機版隱藏 */

    /* Sidebar 手機版全屏（tab 維持右側不變）*/
    :root { --sidebar-w: 100vw; }

    /* 手機版 sidebar 內關閉按鈕：正常文件流，左對齊，上方留空行 */
    #sidebar-close-mobile {
      display: flex;
      align-items: center;

    }
    #sidebar-close-mobile:hover { color: var(--text-primary); }

    /* ── 手機版資訊卡（底部滑出）────────────────────── */
    #mobile-card-overlay {

    #mobile-card-overlay.open {

    #mobile-card {
      display: flex;
      flex-direction: column;

      bottom: 0; left: 0; right: 0;
      z-index: 3100;
      background: rgba(8,16,28,0.97);

      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);

    #mobile-card.open { transform: translateY(0); }
    #mobile-card-header {

    #mobile-card-close {

    #mobile-card-content {

    #mobile-card .pc-head { padding-right: 16px; }

    /* Legend 手機版預設隱藏，上移至 90px 避開切換按鈕 */

    /* Legend 展開按鈕 */
    #legend-toggle {

      align-items: center;

      position: fixed;
      bottom: 35px;
      left: 21px;

      background: rgba(11, 22, 35, 0.92);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 11px 6px 9px;
      font-family: var(--font-mono);

    }
    #legend-toggle:hover  { background: var(--surface2); color: var(--text-primary); }
    #legend-toggle:active { opacity: 0.7; }
    #legend-toggle[aria-expanded="true"] { color: var(--text-primary); }
    .legend-toggle-icon   { font-size: 13px; line-height: 1; }
  }

  @media (max-width: 640px) {

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   data-loader（內嵌，不需要外部 js/ 資料夾）
═══════════════════════════════════════════════════════ */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const cols  = lines[i].split(',');
    const code  = cols[1]?.trim();
    const value = parseFloat(cols[3]);
    if (code && !code.startsWith('OWID_') && !isNaN(value)) {
      result[code] = value;
    }
  }
  return result;
}

async function loadAllData() {
  const BASE = './data/';
  const files = [
    'plastic-waste-emitted-to-the-ocean.csv',
    'share-of-global-plastic-waste-emitted-to-the-ocean.csv',
    'mismanaged-plastic-waste-per-capita.csv',
    'probability-mismanaged-plastic-ocean.csv',
  ];
  const [emittedRes, shareRes, capRes, probRes] = await Promise.all(
    files.map(f => fetch(BASE + f).then(r => r.text()))
  );
  const emittedMap = parseCSV(emittedRes);
  const shareMap   = parseCSV(shareRes);
  const capMap     = parseCSV(capRes);
  const probMap    = parseCSV(probRes);

  const nameMap = {};
  emittedRes.trim().split('\n').slice(1).forEach(line => {
    const cols = line.split(',');
    const name = cols[0]?.trim();
    const code = cols[1]?.trim();
    if (code && !code.startsWith('OWID_')) nameMap[code] = name;
  });

  const allCodes = new Set([...Object.keys(emittedMap), ...Object.keys(shareMap)]);
  const countryData = {};
  allCodes.forEach(iso => {
    countryData[iso] = {
      iso,
      entityName:  nameMap[iso]    ?? iso,
      emittedTons: emittedMap[iso] ?? null,
      globalShare: shareMap[iso]   ?? null,
      perCapita:   capMap[iso]     ?? null,
      probability: probMap[iso]    ?? null,
    };
  });
  return countryData;
}

window.addEventListener('load', async function () {

  /* ── 1. 載入所有 CSV ── */
  let countryData = {};
  try {
    countryData = await loadAllData();
  } catch (err) {
    console.error('資料載入失敗：', err);
    document.querySelector('.loading-label').textContent = '資料載入失敗，請確認 data/ 資料夾存在';
    return;
  }

  /* ── 2. 隱藏 loading ── */
  const loadingEl = document.getElementById('loading');
  loadingEl.classList.add('hidden');
  setTimeout(() => loadingEl.remove(), 700);

  /* ── 3. 初始化地圖（修正視角限制）── */
  const map = L.map('map', {
    center: [20, 10],
    zoom: 2,
    minZoom: 2,
    maxZoom: 8,
    zoomControl: false,  // 停用預設位置，下方另行指定 bottomright
    attributionControl: true,
    maxBounds: [[-85, -180], [85, 180]],   // 上下不超出
    maxBoundsViscosity: 1.0,               // 硬性限制，不可拖出邊界
    worldCopyJump: false,
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 底圖：無文字版，移除國家名稱 label
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);

  /* ── 4. 三套顏色模式定義 ── */
  const MODES = {
    share: {
      label: '全球排放佔比',
      tooltipKey: 'globalShare',
      tooltipSuffix: ' %',
      tooltipLabel: '全球佔比',
      getVal: d => d.globalShare,
      // 藍色系：#1a4d6b（極深）→ #89c2d9（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 10)   return '#1a4d6b'; // 極嚴重
        if (v > 1)    return '#2a6f97'; // 嚴重
        if (v > 0.1)  return '#468faf'; // 中等
        if (v > 0.01) return '#61a5c2'; // 輕微
        return '#89c2d9';               // 極少
      },
      legend: [
        { color: '#1a4d6b', label: '> 10%（極嚴重）' },
        { color: '#2a6f97', label: '1–10%（嚴重）' },
        { color: '#468faf', label: '0.1–1%（中等）' },
        { color: '#61a5c2', label: '0.01–0.1%（輕微）' },
        { color: '#89c2d9', label: '< 0.01%（極少）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
    probability: {
      label: '入海機率',
      tooltipKey: 'probability',
      tooltipSuffix: ' %',
      tooltipLabel: '入海機率',
      getVal: d => d.probability,
      // 青綠系：#1a5244（極深）→ #85cdb5（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 8)    return '#1a5244'; // 極高風險
        if (v > 4)    return '#2a7a60'; // 高風險
        if (v > 1)    return '#3d9e7a'; // 中等
        if (v > 0.1)  return '#5ab896'; // 低
        return '#85cdb5';               // 極低
      },
      legend: [
        { color: '#1a5244', label: '> 8%（極高風險）' },
        { color: '#2a7a60', label: '4–8%（高風險）' },
        { color: '#3d9e7a', label: '1–4%（中等）' },
        { color: '#5ab896', label: '0.1–1%（低）' },
        { color: '#85cdb5', label: '< 0.1%（極低）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
    perCapita: {
      label: '人均廢棄物量',
      tooltipKey: 'perCapita',
      tooltipSuffix: ' kg',
      tooltipLabel: '人均',
      getVal: d => d.perCapita,
      // 靛紫系：#272760（極深）→ #9595d5（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 30)   return '#272760'; // 極高
        if (v > 15)   return '#3a3a8a'; // 高
        if (v > 5)    return '#5555aa'; // 中等
        if (v > 1)    return '#7070c0'; // 低
        return '#9595d5';               // 極低
      },
      legend: [
        { color: '#272760', label: '> 30 kg（極高）' },
        { color: '#3a3a8a', label: '15–30 kg（高）' },
        { color: '#5555aa', label: '5–15 kg（中等）' },
        { color: '#7070c0', label: '1–5 kg（低）' },
        { color: '#9595d5', label: '< 1 kg（極低）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
  };

  let currentMode = 'share';

  /* ── 5. Legend 更新 ── */
  function updateLegend(mode) {
    const m = MODES[mode];
    document.getElementById('legend-title').textContent = m.label;
    document.getElementById('legend-items').innerHTML = m.legend.map(item => `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${item.color};${item.border ? 'border:1px solid #243d59;' : ''}"></div>
        <span class="legend-text">${item.label}</span>
      </div>
    `).join('');
  }
  updateLegend(currentMode);

  /* ── 6. Fallback coords for nations still missing from ne_50m GeoJSON ── */
  // 切換至 ne_50m 後，原本 25 個 fallback 國家中有 24 個已有多邊形。
  // 唯一例外：MTQ（法屬馬提尼克）—— Natural Earth 不把法國海外省
  // 列為獨立 ISO 國家，50m 資料集中找不到對應的 ISO_A3 = MTQ 的 feature。
  const FALLBACK_COORDS = {
    MTQ: [14.64, -61.02, 9],   // Martinique（法國海外省，ne_50m 無此 ISO）
  };

  /* ── 6b. Pre-compute global rankings for all three metrics ── */
  // rankMaps[metric][iso] = rank (1-based)
  const rankMaps = {};
  ['share', 'probability', 'perCapita'].forEach(metric => {
    const m = MODES[metric];
    const sorted = Object.values(countryData)
      .filter(d => m.getVal(d) !== null)
      .sort((a, b) => m.getVal(b) - m.getVal(a));
    rankMaps[metric] = {};
    sorted.forEach((d, i) => { rankMaps[metric][d.iso] = i + 1; });
  });

  function getRank(metric, iso) {
    const r = rankMaps[metric]?.[iso];
    return r ? `#${r} 全球` : null;
  }

  /* ── 6c. Tagline logic (12 conditions) ── */
  function buildTagline(d) {
    const share = d.globalShare;
    const prob  = d.probability;
    const cap   = d.perCapita;
    const noData = (share === null && prob === null && cap === null);
    if (noData) return '目前該國尚無完整數據，污染狀況難以評估。';
    if (share > 10 && prob > 8)   return '地理脆弱與系統失能交疊，使該國成為全球海洋塑膠污染的首要來源。';
    if (share > 10 && cap > 15)   return '廢棄物管理體系的嚴重缺口，推動該國躍居全球海洋污染榜首。';
    if (share > 10)                return '龐大的排放絕對量使該國在全球污染版圖中佔據核心位置。';
    if (share > 1  && prob > 8)   return '高度脆弱的地形與河流條件，使塑膠極易從該國流入海洋。';
    if (share > 1  && cap > 15)   return '廢棄物管理體系的缺口，使大量塑膠透過該國流入海洋。';
    if (share > 1)                 return '該國對全球海洋污染有顯著貢獻，廢棄物治理仍有改善空間。';
    if (prob > 8   && cap > 15)   return '雖然絕對排放量有限，但地理與系統雙重脆弱性不容忽視。';
    if (prob > 8)                  return '獨特的地形與河流條件，使塑膠入海風險遠超污染總量所顯示的程度。';
    if (cap > 15)                  return '人均廢棄物量偏高，反映出廢棄物管理基礎設施仍有待強化。';
    if (share > 0.1 && cap > 3)   return '現有管理體系尚能控制污染輸出，但人均廢棄物量仍值得關注。';
    return '相對健全的廢棄物管理體系，使該國對全球海洋污染的貢獻維持在低水準。';
  }

  /* ── 6d. Build popup HTML ── */
  function buildPopupHTML(d) {
    const fmtTons = n => n !== null ? Math.round(n).toLocaleString('zh-TW') : null;
    const fmtDec  = (n, dec=2) => n !== null ? n.toFixed(dec) : null;

    const shareRank = getRank('share', d.iso);
    const probRank  = getRank('probability', d.iso);
    const capRank   = getRank('perCapita', d.iso);
    const tagline   = buildTagline(d);

    const shareRow = d.emittedTons !== null ? `
      <div class="pc-row">
        <div class="pc-row-head">SDG 14.1 · 污染衝擊</div>
        <div class="pc-row-main">
          <span class="pc-val danger">${fmtTons(d.emittedTons)}</span>
          <span class="pc-rank">${shareRank || ''}</span>
        </div>
        <div class="pc-sub">公噸／年　佔全球 ${fmtDec(d.globalShare)} %</div>
      </div>` : `
      <div class="pc-row">
        <div class="pc-row-head">SDG 14.1 · 污染衝擊</div>
        <div class="pc-nodata">無資料</div>
      </div>`;

    const probRow = d.probability !== null ? `
      <div class="pc-row">
        <div class="pc-row-head">地理歸因 · 入海機率</div>
        <div class="pc-row-main">
          <span class="pc-val teal">${fmtDec(d.probability)} %</span>
          <span class="pc-rank">${probRank || ''}</span>
        </div>
      </div>` : `
      <div class="pc-row">
        <div class="pc-row-head">地理歸因 · 入海機率</div>
        <div class="pc-nodata">無資料</div>
      </div>`;

    const capRow = d.perCapita !== null ? `
      <div class="pc-row">
        <div class="pc-row-head">系統歸因 · 人均廢棄物</div>
        <div class="pc-row-main">
          <span class="pc-val purple">${fmtDec(d.perCapita, 1)} kg</span>
          <span class="pc-rank">${capRank || ''}</span>
        </div>
        <div class="pc-sub">人均／年</div>
      </div>` : `
      <div class="pc-row">
        <div class="pc-row-head">系統歸因 · 人均廢棄物</div>
        <div class="pc-nodata">無資料</div>
      </div>`;

    return `
      <div class="pc-head">
        <div class="pc-name">${d.entityName}</div>
        <div class="pc-iso">${d.iso}</div>
      </div>
      <div class="pc-tagline">${tagline}</div>
      ${shareRow}${probRow}${capRow}
    `;
  }

  /* ── 6e. Sidebar UI ── */
  const sidebar       = document.getElementById('sidebar');
  const sidebarTab    = document.getElementById('sidebar-tab');
  const searchInput   = document.getElementById('sidebar-search');
  const searchResults = document.getElementById('sidebar-search-results');
  const rankingTitle  = document.getElementById('sidebar-ranking-title');
  const rankingList   = document.getElementById('sidebar-ranking-list');

  // Sidebar 收合 / 展開
  function openSidebar() {
    clearTimeout(sidebar._closeTimer);
    if (!sidebar.classList.contains('opened')) {
      sidebar.classList.add('opened');
      sidebar.classList.remove('collapsed');
      sidebarTab.querySelector('.sidebar-tab-arrow').textContent = '‹';
      sidebarTab.style.right = 'var(--sidebar-w)';
    }
  }

  function closeSidebar() {
    if (!sidebar.classList.contains('opened') && sidebar.classList.contains('collapsed')) return;
    sidebar.classList.remove('opened');
    sidebar.classList.add('collapsed');
    sidebarTab.querySelector('.sidebar-tab-arrow').textContent = '›';
    sidebarTab.style.right = '0';
  }

  function scheduleCloseSidebar() {
    clearTimeout(sidebar._closeTimer);
    sidebar._closeTimer = setTimeout(() => {
      if (!sidebar.matches(':hover') && !sidebarTab.matches(':hover')) {
        closeSidebar();
      }
    }, 180);
  }

  sidebarTab.addEventListener('click', () => {
    if (sidebar.classList.contains('collapsed')) {
      openSidebar();
    } else {
      closeSidebar();
    }
  });
  sidebarTab.addEventListener('mouseenter', openSidebar);
  sidebar.addEventListener('mouseenter', openSidebar);
  sidebar.addEventListener('mouseleave', scheduleCloseSidebar);
  sidebarTab.addEventListener('mouseleave', scheduleCloseSidebar);

  // 手機版側邊欄觸發 / 關閉
  const mobileSidebarBtn   = document.getElementById('mobile-sidebar-btn');
  const sidebarCloseMobile = document.getElementById('sidebar-close-mobile');
  if (mobileSidebarBtn)   mobileSidebarBtn.addEventListener('click', openSidebar);
  if (sidebarCloseMobile) sidebarCloseMobile.addEventListener('click', closeSidebar);

  /* ── 8. Mode Toggle ── */

  // 共用切換函式（桌機 + 手機按鈕共用）
  function switchMode(mode) {
    currentMode = mode;

    // 更新桌機版三個 tab 按鈕 active 狀態
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });

    // 更新手機版循環切換按鈕
    const mobileBtn = document.getElementById('mobile-mode-btn');
    if (mobileBtn) {
      mobileBtn.dataset.mode = mode;
      mobileBtn.querySelector('.mobile-mode-label').textContent = MODE_DISPLAY_LABELS[mode];
      // 旋轉 icon 動畫
      const icon = mobileBtn.querySelector('.mobile-mode-icon');
      icon.classList.remove('spinning');
      void icon.offsetWidth; // 強制 reflow，重新觸發 animation
      icon.classList.add('spinning');
    }

    updateLegend(mode);
    renderRanking(mode);
    if (searchInput.value.trim()) searchInput.dispatchEvent(new Event('input'));
    if (geojsonLayer) {
      geojsonLayer.eachLayer(layer => {
        const iso = layer.feature?.properties?.ISO_A3 || layer.feature?.properties?.iso_a3 || '';
        if (iso) layer.setStyle({ fillColor: getColor(iso) });
      });
    }
    // update fallback marker color if visible
    if (fallbackMarker) {
      const popup = map._popup;
      const iso = popup ? Object.keys(FALLBACK_COORDS).find(k => {
        const c = FALLBACK_COORDS[k];
        return c && popup.getLatLng()?.lat === c[0] && popup.getLatLng()?.lng === c[1];
      }) : null;
      if (iso) fallbackMarker.setStyle({ fillColor: getColor(iso) });
    }
  }

  // 桌機版三個 tab 按鈕
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  // 手機版循環切換按鈕
  const mobileModeBtn = document.getElementById('mobile-mode-btn');
  if (mobileModeBtn) {
    mobileModeBtn.addEventListener('click', () => {
      const idx = MODE_ORDER.indexOf(currentMode);
      const nextMode = MODE_ORDER[(idx + 1) % MODE_ORDER.length];
      switchMode(nextMode);
    });
  }

  const MODE_LABELS = {
    share:       '污染衝擊 Top 10',
    probability: '地理歸因 Top 10',
    perCapita:   '系統歸因 Top 10',
  };

  // 與 CSS .mode-btn[data-mode="…"].active 的顏色保持一致
  const MODE_TITLE_COLORS = {
    share:       '#89c2d9',
    probability: '#5ab896',
    perCapita:   '#9595d5',
  };

  // 手機版循環切換用
  const MODE_ORDER = ['share', 'probability', 'perCapita'];
  const MODE_DISPLAY_LABELS = {
    share:       '污染衝擊',
    probability: '地理歸因',
    perCapita:   '系統歸因',
  };

  function fmtModeVal(d, mode) {
    const m = MODES[mode];
    const v = m.getVal(d);
    if (v === null || v === undefined) return '—';
    if (mode === 'share')       return v.toFixed(2) + ' %';
    if (mode === 'probability') return v.toFixed(2) + ' %';
    if (mode === 'perCapita')   return v.toFixed(1) + ' kg';
    return String(v);
  }

  function renderRanking(mode) {
    rankingTitle.textContent = MODE_LABELS[mode];
    // 標題文字與左側豎線同步切換成當前視角的對應色
    const c = MODE_TITLE_COLORS[mode];
    rankingTitle.style.color           = c;
    rankingTitle.style.borderLeftColor = c;
    const m = MODES[mode];
    const sorted = Object.values(countryData)
      .filter(d => m.getVal(d) !== null)
      .sort((a, b) => m.getVal(b) - m.getVal(a))
      .slice(0, 10);

    rankingList.innerHTML = sorted.map((d, i) => `
      <div class="ranking-item" data-iso="${d.iso}">
        <span class="ranking-num">${i + 1}</span>
        <span class="ranking-name">${d.entityName}</span>
        <span class="ranking-val">${fmtModeVal(d, mode)}</span>
      </div>
    `).join('');

    rankingList.querySelectorAll('.ranking-item').forEach(el => {
      el.addEventListener('click', () => flyToCountry(el.dataset.iso));
    });
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchResults.innerHTML = '';
      searchResults.classList.remove('visible');
      return;
    }
    const matches = Object.values(countryData)
      .filter(d => d.entityName.toLowerCase().includes(q) || d.iso.toLowerCase().includes(q))
      .slice(0, 8);

    if (matches.length === 0) {
      searchResults.innerHTML = '<div class="search-result-item"><span class="search-result-name" style="color:var(--text-faint)">找不到符合的國家</span></div>';
    } else {
      searchResults.innerHTML = matches.map(d => `
        <div class="search-result-item" data-iso="${d.iso}">
          <span class="search-result-name">${d.entityName}</span>
          <span class="search-result-val">${fmtModeVal(d, currentMode)}</span>
        </div>
      `).join('');
      searchResults.querySelectorAll('.search-result-item[data-iso]').forEach(el => {
        el.addEventListener('click', () => {
          flyToCountry(el.dataset.iso);
          searchInput.value = '';
          searchResults.innerHTML = '';
          searchResults.classList.remove('visible');
        });
      });
    }
    searchResults.classList.add('visible');
  });

  searchInput.addEventListener('blur', () => {
    setTimeout(() => {
      searchResults.classList.remove('visible');
      searchResults.innerHTML = '';
    }, 150);
  });

  sidebar.addEventListener('mouseleave', () => {
    if (!searchInput.matches(':focus')) {
      searchResults.classList.remove('visible');
      searchResults.innerHTML = '';
    }
  });

  renderRanking('share');

  /* ── 7. GeoJSON Choropleth ── */
  let geojsonLayer = null;
  let activeLayer  = null;
  let fallbackMarker = null; // marker for small nations not in GeoJSON
  let isDragging   = false;  // Bug 2：追蹤拖曳狀態，抑制拖曳時觸發 tooltip

  const DEFAULT_STYLE = { weight: 0.4, color: '#0a1520', opacity: 1, fillOpacity: 0.88 };

  function getColor(iso) {
    const d = countryData[iso];
    if (!d) return '#0d1b2a';
    return MODES[currentMode].color(MODES[currentMode].getVal(d));
  }

  function styleFeature(feature) {
    const iso = feature.properties.ISO_A3 || feature.properties.iso_a3 || '';
    return { ...DEFAULT_STYLE, fillColor: getColor(iso) };
  }

  function buildTooltip(d) {
    const m   = MODES[currentMode];
    const val = m.getVal(d);
    const str = val !== null ? `${typeof val === 'number' && val < 10 ? val.toFixed(2) : Math.round(val)}${m.tooltipSuffix}` : '無資料';
    return `
      <div class="marker-tooltip">
        <strong style="color:#d8e8f5">${d.entityName}</strong><br>
        <span style="color:#6b8ba4;font-size:10px">${m.tooltipLabel}：${str}</span>
      </div>
    `;
  }

  // ── isMobile ──
  function isMobile() { return window.innerWidth <= 768; }

  // ── openPopupForData：開啟 Popup（多邊形或 fallback marker 共用）──
  // Bug 1 Fix：autoPan: false 避免地圖平移後因 maxBounds 彈回；
  //            實際位置修正改由 map.on('popupopen') 的 CSS transform 處理。
  // 手機版：改用底部滑出卡片，不使用 Leaflet popup。
  function openPopupForData(d, latlng) {
    if (isMobile()) {
      openMobileCard(d);
      return;
    }
    L.popup({
      maxWidth: window.innerWidth < 640 ? 280 : 340,
      minWidth: 260,
      className: 'sdg-popup',
      autoPan: false,
      keepInView: false,
      offset: [0, -10],
    })
      .setLatLng(latlng)
      .setContent(buildPopupHTML(d))
      .openOn(map);
  }

  function openMobileCard(d) {
    const card    = document.getElementById('mobile-card');
    const content = document.getElementById('mobile-card-content');
    const overlay = document.getElementById('mobile-card-overlay');
    if (!card || !content) return;
    content.innerHTML = buildPopupHTML(d);
    content.scrollTop = 0;           // 每次開啟捲回頂部
    card.classList.add('open');
    if (overlay) overlay.classList.add('open');
  }

  function closeMobileCard() {
    const card    = document.getElementById('mobile-card');
    const overlay = document.getElementById('mobile-card-overlay');
    if (!card || !card.classList.contains('open')) return;
    card.classList.remove('open');
    if (overlay) overlay.classList.remove('open');
    // fallbackMarker 清理（手機版取代 popupclose 事件）
    if (fallbackMarker) { fallbackMarker.remove(); fallbackMarker = null; }
    // 重置 activeLayer 高亮
    if (activeLayer && geojsonLayer) {
      geojsonLayer.resetStyle(activeLayer);
      activeLayer = null;
    }
  }

  function onEachFeature(feature, layer) {
    const iso = feature.properties.ISO_A3 || feature.properties.iso_a3 || '';
    const d   = countryData[iso];
    if (!d) return;

    //layer.bindTooltip(buildTooltip(d), { sticky: false, className: '', direction: 'top' });
    layer.bindTooltip(buildTooltip(d), {
      sticky: false,
      direction: 'top',
      opacity: 0.9,
      permanent: false // 確保它不是永久顯示的
    });

    layer.on({
      // 在 onEachFeature 函數內修改
      mouseover(e) {
        // Bug 2 Fix：拖曳中或地圖正在移動時，跳過 hover 效果
        if (isDragging || map.dragging.moving()) return;

        e.target.setStyle({ weight: 1.5, color: '#7ab8d4', fillOpacity: 1 });
        e.target.bringToFront();
        document.body.style.cursor = 'pointer';

        const tooltip = e.target.getTooltip();
        if (tooltip) {
          tooltip.setContent(buildTooltip(d));
        }
      },
      mouseout(e) {
        if (e.target !== activeLayer) geojsonLayer?.resetStyle(e.target);
        document.body.style.cursor = '';
      },
      click(e) {
        L.DomEvent.stopPropagation(e);
        if (activeLayer && geojsonLayer) geojsonLayer.resetStyle(activeLayer);
        activeLayer = e.target;
        e.target.setStyle({ weight: 2, color: '#c8e0f0', fillOpacity: 1 });
        e.target.bringToFront();
        openPopupForData(d, e.latlng);
      },
    });
  }

  fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
    .then(r => r.json())
    .then(data => {
      geojsonLayer = L.geoJSON(data, { style: styleFeature, onEachFeature }).addTo(map);
    });

  map.on('click', () => {
    if (activeLayer && geojsonLayer) {
      geojsonLayer.resetStyle(activeLayer);
      activeLayer = null;
    }
    closeMobileCard(); // 手機版：點擊地圖空白處關閉卡片
  });

  // 修正 fallbackMarker 殘留：任何 popup 關閉時都清掉標記點
  // （普通國家的 fallbackMarker 本來就是 null，所以不影響）
  map.on('popupclose', function () {
    if (fallbackMarker) {
      fallbackMarker.remove();
      fallbackMarker = null;
    }
  });

  // ── Bug 1 Fix：popup 開啟後，若超出 header 下緣則用 setLatLng 往下移錨點 ──
  // Leaflet 1.9 以 CSS transform:translate3d 定位 popup 元素，
  // 直接改 el.style.transform 會覆蓋 Leaflet 的定位資訊造成跑版。
  // 正確做法：先隱藏（避免閃動）→ rAF 量真實位置 → setLatLng 調整錨點 → 顯示。
  // .leaflet-popup-tip-container 已隱藏，anchor 偏移不影響視覺。
  map.on('popupopen', function (e) {
    const el = e.popup.getElement();
    if (!el) return;
    el.style.visibility = 'hidden'; // 遮住，量位置時不閃動
    requestAnimationFrame(() => {
      const rect = el.getBoundingClientRect();
      // 無固定 header，HEADER_H 以左上角 top-brand 浮層底部估算
      // top-brand: top:22px + 回首頁連結(16px) + gap(6px) + 標題(21px×1.28×2行≈54px) ≈ 98px
      const HEADER_H = window.innerWidth < 640 ? 80 : 100;
      const MARGIN   = 10;
      if (rect.top < HEADER_H + MARGIN) {
        const overflow     = (HEADER_H + MARGIN) - rect.top;
        const anchorLatLng = e.popup.getLatLng();
        const anchorPt     = map.latLngToContainerPoint(anchorLatLng);
        // 把錨點往南（螢幕向下）移，popup 跟著往下
        e.popup.setLatLng(
          map.containerPointToLatLng(L.point(anchorPt.x, anchorPt.y + overflow))
        );
      }
      el.style.visibility = ''; // 顯示（已在正確位置）
    });
  });

  // ── Bug 2 Fix：拖曳狀態追蹤 + tooltip 攔截 ──
  map.on('dragstart', () => {
    isDragging = true;
  });
  map.on('dragend', () => {
    // 加一點延遲，避免 dragend 後的 mouseover 立刻觸發 tooltip
    setTimeout(() => { isDragging = false; }, 200);
  });
  // Leaflet 的 bindTooltip 內部機制獨立於我們的 mouseover handler，
  // 用 tooltipopen 事件攔截並立即關閉，確保拖曳時完全不顯示。
  map.on('tooltipopen', function (e) {
    if (isDragging) {
      map.closeTooltip(e.tooltip);
    }
  });

  // ── flyToCountry：支援 GeoJSON 多邊形 + fallback 小國座標 ──
  function flyToCountry(iso) {
    if (!geojsonLayer) return;
    let found = false;

    geojsonLayer.eachLayer(layer => {
      const layerIso = layer.feature?.properties?.ISO_A3 || layer.feature?.properties?.iso_a3 || '';
      if (layerIso !== iso) return;
      found = true;
      const bounds = layer.getBounds();
      // maxZoom 提高到 8（地圖上限），避免小島國縮放不足看不到
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: 8 });
      // Reset previous active layer
      if (activeLayer && geojsonLayer) geojsonLayer.resetStyle(activeLayer);
      activeLayer = layer;
      layer.setStyle({ weight: 2, color: '#c8e0f0', fillOpacity: 1 });
      layer.bringToFront();
      const d = countryData[iso];
      if (d) {
        map.once('moveend', () => {
          openPopupForData(d, bounds.getCenter());
        });
      }
    });

    // Fallback for small nations absent from ne_110m
    if (!found) {
      const coords = FALLBACK_COORDS[iso];
      const d = countryData[iso];
      if (!coords || !d) return;
      const [lat, lng, zoom] = coords;
      map.setView([lat, lng], zoom, { animate: true });
      if (fallbackMarker) { fallbackMarker.remove(); fallbackMarker = null; }
      fallbackMarker = L.circleMarker([lat, lng], {
        radius: 8, color: '#c8e0f0', weight: 2,
        fillColor: getColor(iso), fillOpacity: 0.9,
      }).addTo(map);
      map.once('moveend', () => {
        openPopupForData(d, [lat, lng]);
      });
    }
  }

  /* ── Mobile Card 事件綁定（關閉按鈕 + 遮罩點擊）── */
  const mobileCardClose   = document.getElementById('mobile-card-close');
  const mobileCardOverlay = document.getElementById('mobile-card-overlay');
  if (mobileCardClose)   mobileCardClose.addEventListener('click', closeMobileCard);
  if (mobileCardOverlay) mobileCardOverlay.addEventListener('click', closeMobileCard);

  /* ── Legend Toggle（手機版展開/收起）── */
  const legendToggle = document.getElementById('legend-toggle');
  const legendEl     = document.getElementById('legend');
  if (legendToggle && legendEl) {
    legendToggle.addEventListener('click', () => {
      const isOpen = legendEl.classList.toggle('legend-open');
      legendToggle.setAttribute('aria-expanded', isOpen);
      legendToggle.querySelector('.legend-toggle-icon').textContent  = isOpen ? '✕' : '▤';
      legendToggle.querySelector('.legend-toggle-label').textContent = isOpen ? '關閉' : '圖例';
    });
  }

  /* ── 9. Live Counter（全球總量 979,458 公噸/年）── */
  const totalAnnual = 979458;
  const tonPerMs  = totalAnnual / (365.25 * 24 * 3600 * 1000);
  const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
  const counterEl = document.getElementById('counter-num');

  function updateCounter() {
    const tons = Math.floor((Date.now() - yearStart) * tonPerMs);
    counterEl.textContent = tons.toLocaleString('zh-TW');
    requestAnimationFrame(updateCounter);
  }
  updateCounter();

}); // end load
</script>
</body>
</html>

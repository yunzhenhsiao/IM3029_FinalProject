<script>
/* ═══════════════════════════════════════════════════════
   data-loader（內嵌，不需要外部 js/ 資料夾）
═══════════════════════════════════════════════════════ */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const cols  = lines[i].split(',');
    const code  = cols[1]?.trim();
    const value = parseFloat(cols[3]);
    if (code && !code.startsWith('OWID_') && !isNaN(value)) {
      result[code] = value;
    }
  }
  return result;
}

async function loadAllData() {
  const BASE = './data/';
  const files = [
    'plastic-waste-emitted-to-the-ocean.csv',
    'share-of-global-plastic-waste-emitted-to-the-ocean.csv',
    'mismanaged-plastic-waste-per-capita.csv',
    'probability-mismanaged-plastic-ocean.csv',
  ];
  const [emittedRes, shareRes, capRes, probRes] = await Promise.all(
    files.map(f => fetch(BASE + f).then(r => r.text()))
  );
  const emittedMap = parseCSV(emittedRes);
  const shareMap   = parseCSV(shareRes);
  const capMap     = parseCSV(capRes);
  const probMap    = parseCSV(probRes);

  const nameMap = {};
  emittedRes.trim().split('\n').slice(1).forEach(line => {
    const cols = line.split(',');
    const name = cols[0]?.trim();
    const code = cols[1]?.trim();
    if (code && !code.startsWith('OWID_')) nameMap[code] = name;
  });

  const allCodes = new Set([...Object.keys(emittedMap), ...Object.keys(shareMap)]);
  const countryData = {};
  allCodes.forEach(iso => {
    countryData[iso] = {
      iso,
      entityName:  nameMap[iso]    ?? iso,
      emittedTons: emittedMap[iso] ?? null,
      globalShare: shareMap[iso]   ?? null,
      perCapita:   capMap[iso]     ?? null,
      probability: probMap[iso]    ?? null,
    };
  });
  return countryData;
}
</script>

<script>
window.addEventListener('load', async function () {

  /* ── 1. 載入所有 CSV ── */
  let countryData = {};
  try {
    countryData = await loadAllData();
  } catch (err) {
    console.error('資料載入失敗：', err);
    document.querySelector('.loading-label').textContent = '資料載入失敗，請確認 data/ 資料夾存在';
    return;
  }

  /* ── 2. 隱藏 loading ── */
  const loadingEl = document.getElementById('loading');
  loadingEl.classList.add('hidden');
  setTimeout(() => loadingEl.remove(), 700);

  /* ── 3. 初始化地圖（修正視角限制）── */
  const map = L.map('map', {
    center: [20, 10],
    zoom: 2,
    minZoom: 2,
    maxZoom: 8,
    zoomControl: true,
    attributionControl: true,
    maxBounds: [[-85, -180], [85, 180]],   // 上下不超出
    maxBoundsViscosity: 1.0,               // 硬性限制，不可拖出邊界
    worldCopyJump: false,
  });

  // 底圖：無文字版，移除國家名稱 label
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);

  /* ── 4. 三套顏色模式定義 ── */
  const MODES = {
    share: {
      label: '全球排放佔比',
      tooltipKey: 'globalShare',
      tooltipSuffix: ' %',
      tooltipLabel: '全球佔比',
      getVal: d => d.globalShare,
      // 藍色系：#1a4d6b（極深）→ #89c2d9（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 10)   return '#1a4d6b'; // 極嚴重
        if (v > 1)    return '#2a6f97'; // 嚴重
        if (v > 0.1)  return '#468faf'; // 中等
        if (v > 0.01) return '#61a5c2'; // 輕微
        return '#89c2d9';               // 極少
      },
      legend: [
        { color: '#1a4d6b', label: '> 10%（極嚴重）' },
        { color: '#2a6f97', label: '1–10%（嚴重）' },
        { color: '#468faf', label: '0.1–1%（中等）' },
        { color: '#61a5c2', label: '0.01–0.1%（輕微）' },
        { color: '#89c2d9', label: '< 0.01%（極少）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
    probability: {
      label: '入海機率',
      tooltipKey: 'probability',
      tooltipSuffix: ' %',
      tooltipLabel: '入海機率',
      getVal: d => d.probability,
      // 青綠系：#1a5244（極深）→ #85cdb5（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 8)    return '#1a5244'; // 極高風險
        if (v > 4)    return '#2a7a60'; // 高風險
        if (v > 1)    return '#3d9e7a'; // 中等
        if (v > 0.1)  return '#5ab896'; // 低
        return '#85cdb5';               // 極低
      },
      legend: [
        { color: '#1a5244', label: '> 8%（極高風險）' },
        { color: '#2a7a60', label: '4–8%（高風險）' },
        { color: '#3d9e7a', label: '1–4%（中等）' },
        { color: '#5ab896', label: '0.1–1%（低）' },
        { color: '#85cdb5', label: '< 0.1%（極低）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
    perCapita: {
      label: '人均廢棄物量',
      tooltipKey: 'perCapita',
      tooltipSuffix: ' kg',
      tooltipLabel: '人均',
      getVal: d => d.perCapita,
      // 靛紫系：#272760（極深）→ #9595d5（極淺）
      color(v) {
        if (v === null) return '#0d1b2a';
        if (v > 30)   return '#272760'; // 極高
        if (v > 15)   return '#3a3a8a'; // 高
        if (v > 5)    return '#5555aa'; // 中等
        if (v > 1)    return '#7070c0'; // 低
        return '#9595d5';               // 極低
      },
      legend: [
        { color: '#272760', label: '> 30 kg（極高）' },
        { color: '#3a3a8a', label: '15–30 kg（高）' },
        { color: '#5555aa', label: '5–15 kg（中等）' },
        { color: '#7070c0', label: '1–5 kg（低）' },
        { color: '#9595d5', label: '< 1 kg（極低）' },
        { color: '#0d1b2a', border: true, label: '無資料' },
      ],
    },
  };

  let currentMode = 'share';

  /* ── 5. Legend 更新 ── */
  function updateLegend(mode) {
    const m = MODES[mode];
    document.getElementById('legend-title').textContent = m.label;
    document.getElementById('legend-items').innerHTML = m.legend.map(item => `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${item.color};${item.border ? 'border:1px solid #243d59;' : ''}"></div>
        <span class="legend-text">${item.label}</span>
      </div>
    `).join('');
  }
  updateLegend(currentMode);

  /* ── 6. Sidebar ── */
  const sidebar          = document.getElementById('sidebar');
  const sidebarCountry   = document.getElementById('sidebar-country');
  const sidebarCountryEn = document.getElementById('sidebar-country-en');
  const sidebarBody      = document.getElementById('sidebar-body');
  const closeBtn         = document.getElementById('close-btn');

  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    return Math.round(n).toLocaleString('zh-TW');
  }
  function fmtDec(n, d = 2) {
    if (n === null || n === undefined) return '—';
    return n.toFixed(d);
  }
  function probClass(p) {
    if (p === null) return 'low';
    if (p > 3) return 'high';
    if (p > 1) return 'mid';
    return 'low';
  }

  function openSidebar(d) {
    sidebarCountry.textContent   = d.entityName;
    sidebarCountryEn.textContent = d.iso;

    const pClass   = probClass(d.probability);
    const shareBar = d.globalShare ? Math.min(d.globalShare / 40 * 100, 100) : 0;
    const capBar   = d.perCapita   ? Math.min(d.perCapita / 50 * 100, 100) : 0;
    const probBar  = d.probability ? Math.min(d.probability / 10 * 100, 100) : 0;
    const naNote   = `<p class="no-data-note">此國家無此項資料</p>`;

    sidebarBody.innerHTML = `
      <div class="data-section">
        <div class="section-label">第一層 · Layer 1</div>
        <div class="section-title">污染衝擊</div>
        ${d.emittedTons !== null ? `
          <div class="big-stat">
            <span class="big-number">${fmtNum(d.emittedTons)}</span>
            <span class="big-unit">公噸／年</span>
          </div>
          <p style="font-family:var(--font-mono);font-size:11px;color:#a0bdd4;">陸源塑膠年排海量</p>
        ` : naNote}
        ${d.globalShare !== null ? `
          <div class="bar-container">
            <div class="bar-label-row">
              <span>佔全球排放份額</span>
              <span style="color:var(--danger)">${fmtDec(d.globalShare)} %</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill danger" style="width:0%" data-target="${shareBar}%"></div>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-label">全球佔比</span>
            <span class="stat-val">${fmtDec(d.globalShare)} %</span>
          </div>
        ` : ''}
      </div>

      <div class="data-section">
        <div class="section-label">第二層 · Layer 2</div>
        <div class="section-title">地理歸因</div>
        ${d.probability !== null ? `
          <div class="prob-number ${pClass}">${fmtDec(d.probability)} %</div>
          <div class="bar-container">
            <div class="bar-track">
              <div class="bar-fill ${pClass === 'high' ? 'danger' : pClass === 'mid' ? 'warn' : 'safe'}"
                   style="width:0%" data-target="${probBar}%"></div>
            </div>
          </div>
          <p class="explanation">管理不善塑膠經由河流最終入海的機率估算。受地形坡度、河流密度與沿岸距離影響，反映該國地理環境的脆弱性。</p>
        ` : naNote}
      </div>

      <div class="data-section">
        <div class="section-label">第三層 · Layer 3</div>
        <div class="section-title">系統歸因</div>
        ${d.perCapita !== null ? `
          <div class="percap-number">${fmtDec(d.perCapita, 1)}
            <span style="font-family:var(--font-mono);font-size:13px;color:#a0bdd4">公斤／人／年</span>
          </div>
          <div class="bar-container">
            <div class="bar-label-row">
              <span>相對強度（50 kg 為滿格）</span>
              <span style="color:var(--warn)">${fmtDec(d.perCapita, 1)} kg</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill warn" style="width:0%" data-target="${capBar}%"></div>
            </div>
          </div>
          <p class="explanation">每人每年產生的管理不善塑膠量，反映廢棄物收集體系與回收基礎設施的整體效率。數值越高，代表系統性失能越嚴重。</p>
        ` : naNote}
      </div>

      <div style="padding:16px 24px;">
        <p style="font-family:var(--font-mono);font-size:9px;color:var(--text-faint);line-height:1.7;">
          資料來源：Our World in Data · Meijer et al. (2021). Science Advances, 7(18).
        </p>
      </div>
    `;

    sidebar.classList.add('open');
    sidebar.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => {
      setTimeout(() => {
        sidebarBody.querySelectorAll('.bar-fill').forEach(el => {
          el.style.width = el.dataset.target;
        });
      }, 80);
    });
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebar.setAttribute('aria-hidden', 'true');
    if (activeLayer && geojsonLayer) {
      geojsonLayer.resetStyle(activeLayer);
      activeLayer = null;
    }
  }

  closeBtn.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

  /* ── 7. GeoJSON Choropleth ── */
  let geojsonLayer = null;
  let activeLayer  = null;

  const DEFAULT_STYLE = { weight: 0.4, color: '#0a1520', opacity: 1, fillOpacity: 0.88 };

  function getColor(iso) {
    const d = countryData[iso];
    if (!d) return '#0d1b2a';
    return MODES[currentMode].color(MODES[currentMode].getVal(d));
  }

  function styleFeature(feature) {
    const iso = feature.properties.ISO_A3 || feature.properties.iso_a3 || '';
    return { ...DEFAULT_STYLE, fillColor: getColor(iso) };
  }

  function buildTooltip(d) {
    const m   = MODES[currentMode];
    const val = m.getVal(d);
    const str = val !== null ? `${typeof val === 'number' && val < 10 ? val.toFixed(2) : Math.round(val)}${m.tooltipSuffix}` : '無資料';
    return `
      <div class="marker-tooltip">
        <strong style="color:#d8e8f5">${d.entityName}</strong><br>
        <span style="color:#6b8ba4;font-size:10px">${m.tooltipLabel}：${str}</span>
      </div>
    `;
  }

  function onEachFeature(feature, layer) {
    const iso = feature.properties.ISO_A3 || feature.properties.iso_a3 || '';
    const d   = countryData[iso];
    if (!d) return;

    layer.bindTooltip(buildTooltip(d), { sticky: false, className: '', direction: 'top' });

    layer.on({
      mouseover(e) {
        e.target.setStyle({ weight: 1.5, color: '#7ab8d4', fillOpacity: 1 });
        e.target.bringToFront();
        document.body.style.cursor = 'pointer';
        // Update tooltip content for current mode
        e.target.getTooltip()?.setContent(buildTooltip(d));
      },
      mouseout(e) {
        if (e.target !== activeLayer) geojsonLayer?.resetStyle(e.target);
        document.body.style.cursor = '';
      },
      click(e) {
        L.DomEvent.stopPropagation(e);
        if (activeLayer && geojsonLayer) geojsonLayer.resetStyle(activeLayer);
        activeLayer = e.target;
        e.target.setStyle({ weight: 2, color: '#c8e0f0', fillOpacity: 1 });
        e.target.bringToFront();
        openSidebar(d);
      },
    });
  }

  fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
    .then(r => r.json())
    .then(data => {
      geojsonLayer = L.geoJSON(data, { style: styleFeature, onEachFeature }).addTo(map);
    });

  map.on('click', () => closeSidebar());

  /* ── 8. Mode Toggle ── */
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateLegend(currentMode);
      if (geojsonLayer) {
        geojsonLayer.eachLayer(layer => {
          const iso = layer.feature?.properties?.ISO_A3 || layer.feature?.properties?.iso_a3 || '';
          if (iso && iso !== activeLayer?.feature?.properties?.ISO_A3) {
            layer.setStyle({ fillColor: getColor(iso) });
          }
        });
      }
    });
  });

  /* ── 9. Live Counter（全球總量 979,458 公噸/年）── */
  const totalAnnual = 979458;
  const tonPerMs  = totalAnnual / (365.25 * 24 * 3600 * 1000);
  const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
  const counterEl = document.getElementById('counter-num');

  function updateCounter() {
    const tons = Math.floor((Date.now() - yearStart) * tonPerMs);
    counterEl.textContent = tons.toLocaleString('zh-TW');
    requestAnimationFrame(updateCounter);
  }
  updateCounter();

}); // end load
</script>
</body>
</html>
